<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>주님과의 대화</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f9f6f2;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #4caf50;
      color: white;
      border: none;
      cursor: pointer;
    }
    .response {
      margin-top: 2rem;
      background-color: #fff;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>🕊️ 주님과의 대화</h1>
  <p>마음을 털어놓아 보세요. 주님께서 들어주실 거예요.</p>
  <textarea id="prayerInput" placeholder="예: 요즘 너무 지치고 힘들어요...저에게 지혜를 주세요."></textarea><br>
  <button onclick="sendPrayer()">🙏 기도 올리기</button>

  <div class="response" id="responseBox"></div>

  <script>
    async function sendPrayer() {
      const input = document.getElementById("prayerInput").value;
      const responseBox = document.getElementById("responseBox");
      responseBox.textContent = "주님께 기도를 전하는 중입니다...";

      try {
        const res = await fetch("http://localhost:3000/pray", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ prayer: input }),
        });

        const data = await res.json();
        responseBox.textContent = data.response || "응답을 받아오지 못했습니다.";
      } catch (err) {
        console.error("에러 발생:", err);
        responseBox.textContent = "⚠️ 기도를 전하는 데 문제가 발생했습니다. 콘솔을 확인해주세요.";
      }
    }
  </script>
</body>
</html>
